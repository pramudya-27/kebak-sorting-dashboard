name: wsl-vision
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision
  - cudatoolkit=11.8
  - pip
  - numpy>=1.21.0
  - opencv
  - pyyaml
  - scipy
  - pip:
    - ultralytics>=8.0.0
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - websockets>=12.0
    - opencv-python>=4.5.0
    - pyaml>=21.0.0
